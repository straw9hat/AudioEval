[project]
name = "audioeval"
version = "0.1.0"
description = "Voice tone and background noise analysis for call audio"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# Third-party notice from Starlette's TestClient; not actionable in this project.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["audioeval", "conftest"]
